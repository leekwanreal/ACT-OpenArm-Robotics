[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-act-training"
version = "1.0.0"
description = "Production Training Pipeline for Action Chunking with Transformers (ACT) - Bimanual OpenArm 16-DOF with RGB-D"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "OpenArm Team" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "scipy>=1.10.0",
    "h5py>=3.8.0",
    "opencv-python>=4.7.0",
    "Pillow>=9.5.0",
    "tensorboard>=2.12.0",
    "wandb>=0.15.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.17.0",
    "onnxscript>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["act_pipeline*"]

