[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm_mujoco"
version = "2.3.0"
authors = [{name = "Enactic, Inc."}]
description = "MuJoCo Description Files (MJCF) for OpenArm"
license = {text = "Apache-2.0"}
maintainers = [{name = "Enactic, Inc."}]
readme = "README.md"
# No requires-python (>=3.10): Ubuntu 24.04's setuptools hands it to colcon
# as a SpecifierSet, which colcon cannot read back, and the build fails.
dependencies = [
    "mujoco>=3.6.0",
    "numpy",
]

[project.urls]
Changelog = "https://github.com/enactic/openarm_mujoco/releases"
Issues = "https://github.com/enactic/openarm_mujoco/issues"
Repository = "https://github.com/enactic/openarm_mujoco.git"

[project.scripts]
openarm-mujoco-launch = "openarm_mujoco.v2.launch:main"
openarm-mujoco-can = "openarm_mujoco.can_bridge:main"
# ros2 run openarm_mujoco can_bridge
can_bridge = "openarm_mujoco.can_bridge:main"

[dependency-groups]
dev = [
    "ruff == 0.14.11", # sync with .pre-commit-config.yaml
]

[tool.ruff.lint]
extend-select = [
  "D",   # pydocstyle
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"!src/**.py" = ["D"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
# See the note in setup.py: a colcon --symlink-install build leaves a
# src/share tree behind that must not be mistaken for a package.
exclude = ["share", "share.*"]
