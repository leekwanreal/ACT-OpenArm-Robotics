<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 6px; ry: 6px; }
      .box-topic { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 6px; ry: 6px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #000000; text-anchor: middle; }
      .text-mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 13.5px; font-weight: 600; fill: #000000; text-anchor: middle; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 12.5px; font-weight: 400; fill: #374151; text-anchor: middle; }
      .arrow { stroke: #000000; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- ================= INPUT SOURCES ================= -->
  <!-- ui -->
  <rect x="40" y="35" width="80" height="36" class="box" />
  <text x="80" y="58" class="text-mono">ui</text>

  <!-- teleop -->
  <rect x="40" y="87" width="80" height="36" class="box" />
  <text x="80" y="110" class="text-mono">teleop</text>

  <!-- act -->
  <rect x="40" y="139" width="80" height="36" class="box" />
  <text x="80" y="162" class="text-mono">act</text>

  <!-- Bracket lines from sources to command_proxy -->
  <path d="M 120 53 L 145 53 L 145 105" class="arrow" />
  <path d="M 120 157 L 145 157 L 145 105" class="arrow" />
  <path d="M 120 105 L 165 105" class="arrow" marker-end="url(#arrow)" />

  <!-- ================= COMMAND PROXY ================= -->
  <rect x="165" y="77" width="210" height="56" class="box" />
  <text x="270" y="101" class="text-mono">openarm_command_proxy</text>
  <text x="270" y="122" class="text-sub">(picks one source)</text>

  <!-- Arrow from command proxy to joint_commands -->
  <path d="M 375 105 L 420 105" class="arrow" marker-end="url(#arrow)" />

  <!-- ================= JOINT COMMANDS TOPIC ================= -->
  <rect x="420" y="80" width="280" height="50" class="box-topic" />
  <text x="560" y="111" class="text-mono">/openarm/joint_commands</text>

  <!-- Arrow down from joint_commands to controller -->
  <path d="M 560 130 L 560 175" class="arrow" marker-end="url(#arrow)" />

  <!-- ================= CONTROLLER ================= -->
  <rect x="405" y="175" width="310" height="60" class="box" />
  <text x="560" y="200" class="text-mono">openarm_controller</text>
  <text x="560" y="222" class="text-sub">quintic smoothing, 400 Hz CAN</text>

  <!-- Fork from controller to hardware and sim -->
  <path d="M 560 235 L 560 265" class="arrow" />
  <path d="M 380 265 L 740 265" class="arrow" />
  <path d="M 380 265 L 380 295" class="arrow" marker-end="url(#arrow)" />
  <path d="M 740 265 L 740 295" class="arrow" marker-end="url(#arrow)" />

  <!-- ================= CAN / ROBOT ================= -->
  <rect x="280" y="295" width="200" height="60" class="box" />
  <text x="380" y="320" class="text-mono">can0 / can1</text>
  <text x="380" y="342" class="text-sub">the robot</text>

  <!-- ================= VCAN0 / SIM ================= -->
  <rect x="640" y="295" width="200" height="60" class="box" />
  <text x="740" y="320" class="text-mono">vcan0</text>
  <text x="740" y="342" class="text-sub">openarm_mujoco sim</text>

  <!-- Join from robot & sim to joint_states -->
  <path d="M 380 355 L 380 385" class="arrow" />
  <path d="M 740 355 L 740 385" class="arrow" />
  <path d="M 380 385 L 740 385" class="arrow" />
  <path d="M 560 385 L 560 415" class="arrow" marker-end="url(#arrow)" />

  <!-- ================= JOINT STATES & GRIPPERS ================= -->
  <rect x="280" y="415" width="560" height="65" class="box-topic" />
  <text x="560" y="441" class="text-mono">/openarm/joint_states <tspan class="text-sub" font-size="12">(14 arm joints, 100 Hz)</tspan></text>
  <text x="560" y="465" class="text-mono">/openarm/left_gripper <tspan dx="28">/openarm/right_gripper</tspan></text>

</svg>
